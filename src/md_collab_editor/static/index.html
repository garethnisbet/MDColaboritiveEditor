<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MD Editor</title>
<link id="gh-css" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-light.min.css">
<link id="hl-css" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.css">
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/mode/overlay.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/gfm/gfm.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/continuelist.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/dialog/dialog.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/searchcursor.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/search.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/search/jump-to-line.min.js"></script>
</head>
<body>
<header id="topbar">
  <button id="toggle-files" class="icon-btn" title="Files">☰</button>
  <button id="open-browse" class="icon-btn" title="Open a markdown file (Ctrl+O)">📂</button>
  <span id="doc-name">—</span>
  <span id="save-state" class="muted"></span>
  <div class="spacer"></div>
  <div class="seg" id="view-mode">
    <button data-mode="edit">Edit</button><button data-mode="split" class="on">Split</button><button data-mode="preview">Preview</button>
  </div>
  <select id="model" title="Claude model">
    <option value="">Default model</option>
    <option value="opus">Opus</option>
    <option value="sonnet">Sonnet</option>
    <option value="haiku">Haiku</option>
  </select>
  <button id="export-pdf" title="Export as PDF: saved next to the .md file and downloaded (Ctrl+P prints the preview)">⬇ PDF</button>
  <button id="theme" class="icon-btn" title="Light / dark">◐</button>
  <button id="toggle-claude" class="icon-btn" title="Claude panel">✦</button>
</header>

<div id="banner" hidden></div>

<main id="main" class="split">
  <aside id="files">
    <div class="side-head"><span>Files</span><span><button id="browse-btn" class="small-btn" title="Browse for a markdown file (Ctrl+O)">Open…</button> <button id="new-file" class="small-btn" title="New file">+ New</button></span></div>
    <div id="file-root" class="muted"></div>
    <ul id="file-list"></ul>
  </aside>

  <section id="editor-pane">
    <div id="toolbar">
      <button data-cmd="h1" title="Heading">H</button>
      <button data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
      <button data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
      <button data-cmd="strike" title="Strikethrough"><s>S</s></button>
      <span class="sep"></span>
      <button data-cmd="quote" title="Quote">❝</button>
      <button data-cmd="code" title="Inline code">&lt;/&gt;</button>
      <button data-cmd="codeblock" title="Code block">{ }</button>
      <button data-cmd="link" title="Link (Ctrl+K)">🔗</button>
      <button data-cmd="image" title="Image">🖼</button>
      <span class="sep"></span>
      <button data-cmd="ul" title="Bulleted list">•</button>
      <button data-cmd="ol" title="Numbered list">1.</button>
      <button data-cmd="task" title="Task list">☑</button>
      <button data-cmd="table" title="Table">▦</button>
      <button data-cmd="hr" title="Horizontal rule">―</button>
      <span class="sep"></span>
      <button data-cmd="undo" title="Undo (Ctrl+Z)">↶</button>
      <button data-cmd="redo" title="Redo (Ctrl+Y)">↷</button>
      <div class="spacer"></div>
      <button data-cmd="ask" class="ask-btn" title="Ask Claude about the selection (Ctrl+J)">✦ Ask Claude</button>
    </div>
    <div id="editor"></div>
  </section>

  <section id="preview-pane">
    <article id="preview" class="markdown-body"></article>
  </section>

  <aside id="claude">
    <div class="side-head"><span>✦ Claude</span><button id="clear-cards" class="small-btn">Clear done</button></div>
    <div id="cards">
      <p class="muted hint" id="cards-empty">Highlight text in the editor or the preview, then pick an action from the pop-up (or press <kbd>Ctrl</kbd>+<kbd>J</kbd>). With nothing selected, the request applies to the whole document.</p>
    </div>
  </aside>
</main>

<footer id="status"><span id="stat-words"></span><span id="stat-cursor"></span><span id="stat-root" class="muted"></span></footer>

<div id="askbar" hidden>
  <div id="ask-presets"></div>
  <form id="ask-form"><input id="ask-input" placeholder="Ask Claude to… (Enter to send, Esc to close)" autocomplete="off"><button type="submit">Send</button></form>
</div>

<div id="browser" hidden>
  <div class="browser-box" role="dialog" aria-label="Open a markdown file">
    <div class="browser-head">
      <strong>Open a markdown file</strong>
      <button id="browser-close" class="icon-btn" title="Close (Esc)">✕</button>
    </div>
    <form id="browser-path-form">
      <button type="button" id="browser-up" title="Parent folder">↑</button>
      <button type="button" id="browser-home" title="Home folder">⌂</button>
      <input id="browser-path" spellcheck="false" autocomplete="off" title="Type a folder or file path and press Enter">
    </form>
    <ul id="browser-list"></ul>
    <div class="browser-foot">
      <span id="browser-msg" class="muted">Click a folder to enter it; click a .md file to open it.</span>
      <button id="browser-use-folder" title="Show every markdown file in this folder in the sidebar">Use this folder</button>
    </div>
  </div>
</div>

<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
