[project]
name = "md-collab-editor"
dynamic = ["version"]
description = "Local GitHub-style markdown editor shared between you and Claude Code"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gareth Nisbet" }]
keywords = ["markdown", "editor", "claude", "claude-code", "gfm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Text Editors",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.scripts]
md-editor = "md_collab_editor.server:main"

[project.urls]
Repository = "https://github.com/garethnisbet/MDCollaborativeEditor"
Issues = "https://github.com/garethnisbet/MDCollaborativeEditor/issues"

[tool.hatch.version]
path = "src/md_collab_editor/__init__.py"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
